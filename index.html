<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>✨ ZoobiChat - One to One</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #app {
      width: 100%;
      max-width: 480px;
      height: 90vh;
      max-height: 800px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ===== SCREENS ===== */
    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }

    .hidden {
      display: none !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== SIGNIN SCREEN ===== */
    .signin-screen {
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
    }

    .signin-container {
      width: 100%;
      max-width: 360px;
      padding: 20px;
    }

    .logo {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo i {
      font-size: 3.5rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .logo h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 5px;
    }

    .logo .subtitle {
      color: #718096;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .signin-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      display: flex;
      align-items: center;
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 0 16px;
      transition: all 0.3s ease;
    }

    .input-group:focus-within {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
      background: white;
    }

    .input-group i {
      color: #a0aec0;
      font-size: 1.1rem;
      margin-right: 12px;
    }

    .input-group input {
      flex: 1;
      padding: 14px 0;
      border: none;
      background: transparent;
      font-size: 1rem;
      outline: none;
      color: #2d3748;
    }

    .input-group input::placeholder {
      color: #a0aec0;
    }

    .username-rules {
      padding: 0 4px;
    }

    .username-rules small {
      color: #718096;
      font-size: 0.8rem;
    }

    .btn-primary {
      padding: 14px 24px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .error-message {
      color: #fc8181;
      font-size: 0.85rem;
      text-align: center;
      min-height: 20px;
      margin-top: -8px;
    }

    .error-message.small {
      font-size: 0.75rem;
      margin-top: 4px;
      min-height: 16px;
    }

    /* ===== CHAT SCREEN ===== */
    .chat-screen {
      padding: 0;
      height: 100%;
    }

    /* Header */
    .chat-header {
      padding: 16px 20px;
      background: white;
      border-bottom: 2px solid #f7fafc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar i {
      font-size: 2.2rem;
      color: #667eea;
    }

    .user-details {
      display: flex;
      flex-direction: column;
    }

    .user-details .username {
      font-weight: 600;
      color: #2d3748;
      font-size: 1.05rem;
    }

    .user-details .status {
      font-size: 0.75rem;
      color: #48bb78;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .user-details .status i {
      font-size: 0.5rem;
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: #a0aec0;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: all 0.2s ease;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover {
      background: #f7fafc;
      color: #fc8181;
    }

    .btn-icon.small {
      width: 28px;
      height: 28px;
      font-size: 0.9rem;
    }

    /* Search Area */
    .search-area {
      padding: 12px 20px;
      background: #f7fafc;
      border-bottom: 2px solid #edf2f7;
      flex-shrink: 0;
    }

    .search-input-group {
      display: flex;
      align-items: center;
      background: white;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 0 12px;
      transition: all 0.3s ease;
    }

    .search-input-group:focus-within {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .search-input-group i {
      color: #a0aec0;
      font-size: 0.9rem;
    }

    .search-input-group input {
      flex: 1;
      padding: 10px 12px;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      outline: none;
      color: #2d3748;
    }

    .search-input-group input::placeholder {
      color: #a0aec0;
    }

    .btn-search {
      padding: 8px 16px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-search:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .btn-search:active {
      transform: scale(0.98);
    }

    /* Chat Partner Info */
    .chat-partner-info {
      padding: 10px 20px;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
      border-bottom: 2px solid #edf2f7;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .chat-partner-info i {
      color: #667eea;
      font-size: 1rem;
    }

    .chat-partner-info span {
      flex: 1;
      font-weight: 600;
      color: #2d3748;
      font-size: 0.95rem;
    }

    /* Messages Container */
    .messages-container {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: linear-gradient(180deg, #fafbfc, #f7fafc);
    }

    .messages-container::-webkit-scrollbar {
      width: 5px;
    }

    .messages-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages-container::-webkit-scrollbar-thumb {
      background: #cbd5e0;
      border-radius: 10px;
    }

    .system-message {
      text-align: center;
      color: #718096;
      font-size: 0.85rem;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 12px;
      margin: 4px auto;
      max-width: 80%;
      border: 1px solid #e2e8f0;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 16px;
      word-wrap: break-word;
      animation: slideIn 0.2s ease;
      position: relative;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.own {
      align-self: flex-end;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.other {
      align-self: flex-start;
      background: white;
      color: #2d3748;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .message .message-text {
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .message .message-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      gap: 12px;
      font-size: 0.65rem;
      opacity: 0.7;
    }

    .message.own .message-meta {
      color: rgba(255, 255, 255, 0.8);
    }

    .message.other .message-meta {
      color: #718096;
    }

    .message .delete-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 0.75rem;
      opacity: 0.5;
      transition: all 0.2s ease;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .message.own .delete-btn {
      color: rgba(255, 255, 255, 0.7);
    }

    .message.other .delete-btn {
      color: #fc8181;
    }

    .message .delete-btn:hover {
      opacity: 1;
      background: rgba(0, 0, 0, 0.1);
    }

    .message .sender-name {
      font-weight: 600;
      font-size: 0.8rem;
      margin-bottom: 4px;
      display: block;
    }

    /* Message Input */
    .message-input-area {
      padding: 12px 20px 16px;
      background: white;
      border-top: 2px solid #f7fafc;
      flex-shrink: 0;
    }

    .message-input-group {
      display: flex;
      align-items: center;
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 0 12px;
      transition: all 0.3s ease;
    }

    .message-input-group:focus-within {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      background: white;
    }

    .message-input-group input {
      flex: 1;
      padding: 12px 8px;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      outline: none;
      color: #2d3748;
    }

    .message-input-group input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message-input-group input::placeholder {
      color: #a0aec0;
    }

    .btn-send {
      padding: 8px 16px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
    }

    .btn-send:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .btn-send:active:not(:disabled) {
      transform: scale(0.95);
    }

    .btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .char-count {
      text-align: right;
      font-size: 0.7rem;
      color: #a0aec0;
      margin-top: 4px;
      padding-right: 4px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      #app {
        height: 100vh;
        max-height: none;
        border-radius: 0;
        padding: 0;
      }
      
      .screen {
        padding: 16px;
      }
      
      .chat-header {
        padding: 12px 16px;
      }
      
      .search-area {
        padding: 10px 16px;
      }
      
      .messages-container {
        padding: 12px 16px;
      }
      
      .message-input-area {
        padding: 10px 16px 12px;
      }
    }

    @media (max-width: 400px) {
      .message {
        max-width: 85%;
      }
      
      .btn-search span {
        display: none;
      }
      
      .btn-search i {
        margin: 0;
      }
    }

    /* ===== UTILITY ===== */
    .online i {
      color: #48bb78;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Sign In Screen -->
    <div id="signinScreen" class="screen signin-screen">
      <div class="signin-container">
        <div class="logo">
          <i class="fas fa-comment-dots"></i>
          <h1>ZoobiChat</h1>
          <p class="subtitle">One-to-One Chat</p>
        </div>
        
        <div class="signin-form">
          <div class="input-group">
            <i class="fas fa-user"></i>
            <input 
              type="text" 
              id="usernameInput" 
              placeholder="Choose a unique username" 
              maxlength="20"
              autocomplete="off"
            />
          </div>
          <div class="username-rules">
            <small>Letters, numbers, and underscores only</small>
          </div>
          <button id="signinBtn" class="btn-primary">
            <i class="fas fa-sign-in-alt"></i> Start Chatting
          </button>
          <div id="signinError" class="error-message"></div>
        </div>
      </div>
    </div>

    <!-- Chat Screen -->
    <div id="chatScreen" class="screen chat-screen hidden">
      <!-- Header -->
      <div class="chat-header">
        <div class="user-info">
          <div class="avatar">
            <i class="fas fa-user-circle"></i>
          </div>
          <div class="user-details">
            <span id="currentUsername" class="username">User</span>
            <span class="status online"><i class="fas fa-circle"></i> Online</span>
          </div>
        </div>
        <button id="logoutBtn" class="btn-icon" title="Sign Out">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>

      <!-- User Search -->
      <div class="search-area">
        <div class="search-input-group">
          <i class="fas fa-search"></i>
          <input 
            type="text" 
            id="findUserInput" 
            placeholder="Find user by username..." 
            autocomplete="off"
          />
          <button id="findUserBtn" class="btn-search">
            <i class="fas fa-user-plus"></i> <span>Chat</span>
          </button>
        </div>
        <div id="searchError" class="error-message small"></div>
      </div>

      <!-- Chat Partner Info -->
      <div id="chatPartnerInfo" class="chat-partner-info hidden">
        <i class="fas fa-user"></i>
        <span id="chatPartnerName">Partner</span>
        <button id="closeChatBtn" class="btn-icon small">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <!-- Messages -->
      <div id="messagesContainer" class="messages-container">
        <div class="system-message">
          <i class="fas fa-info-circle"></i>
          Find a user to start chatting
        </div>
      </div>

      <!-- Message Input -->
      <div class="message-input-area">
        <div class="input-group message-input-group">
          <input 
            type="text" 
            id="messageInput" 
            placeholder="Type a message..." 
            maxlength="300"
            autocomplete="off"
            disabled
          />
          <button id="sendMsgBtn" class="btn-send" disabled>
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
        <div class="char-count">
          <span id="charCount">0/300</span>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
